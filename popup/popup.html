<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chrome MCP Bridge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="app">
    <header class="hdr">
      <div class="brand">
        <span class="mark" aria-hidden="true">
          <svg viewBox="0 0 128 128" width="30" height="30">
            <defs>
              <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
                <stop offset="0" stop-color="#3ddc97"/><stop offset="1" stop-color="#5b8cff"/>
              </linearGradient>
            </defs>
            <rect x="6" y="6" width="116" height="116" rx="30" fill="#0b1020" stroke="#22315f" stroke-width="6"/>
            <path d="M40 88 L64 42 L88 88" fill="none" stroke="url(#g1)" stroke-width="10"
                  stroke-linecap="round" stroke-linejoin="round"/>
            <circle cx="64" cy="42" r="11" fill="#3ddc97"/>
            <line x1="40" y1="94" x2="88" y2="94" stroke="#5b8cff" stroke-width="8" stroke-linecap="round"/>
          </svg>
        </span>
        <div class="brand-text">
          <h1>Chrome <span>MCP Bridge</span></h1>
          <p class="sub">v<span id="ver">–</span> · <span id="inst-browser-short">this browser</span></p>
        </div>
      </div>
      <span class="dot bad" id="dot-bridge" title="bridge state"></span>
    </header>

    <section class="hero">
      <div class="hero-status">
        <span class="pill" id="pill-native">…</span>
        <span class="pill" id="pill-server">…</span>
      </div>

      <div class="endpoint">
        <span class="endpoint-icon" aria-hidden="true">›</span>
        <code id="endpoint">http://127.0.0.1:12306/mcp</code>
        <button class="icon-btn" id="copy-btn" title="Copy endpoint">copy</button>
      </div>
      <p class="hint mono" id="ext-id"></p>

      <div class="controls">
        <div class="field">
          <label for="port">MCP port</label>
          <input id="port" type="number" min="1024" max="65535" value="12306" class="mono" />
        </div>
        <button id="newport-btn" title="Move to the next free port (conflict resolution)">New port</button>
        <button id="connect-btn" class="primary">Connect</button>
        <button id="disconnect-btn">Disconnect</button>
      </div>
    </section>

    <section class="card accent">
      <div class="card-hd">
        <span class="lbl">Interception</span>
        <span class="pill bad" id="pill-proxy">off</span>
      </div>
      <div class="controls">
        <label class="switch" title="Route all browser traffic through the interceptor">
          <input type="checkbox" id="proxy-toggle" />
          <span class="track"><span class="thumb"></span></span>
        </label>
        <input id="proxy-url" class="mono grow" value="127.0.0.1:9999" spellcheck="false" autocomplete="off" />
      </div>
      <p class="hint" id="proxy-hint">Every browser request is routed through the interceptor so it lands in its history.</p>
    </section>

    <section class="card">
      <div class="card-hd"><span class="lbl">This browser</span></div>
      <div class="row">
        <code class="mono ellipsis" id="inst-id">…</code>
      </div>
      <div class="controls">
        <input id="label" type="text" maxlength="60" placeholder="label, e.g. brave-work"
               autocomplete="off" class="grow" />
        <button id="label-btn">Save</button>
      </div>
      <p class="hint" id="inst-browser"></p>
    </section>

    <section class="log">
      <div class="log-hd">
        <span>Session log</span>
        <button id="clear-log">clear</button>
      </div>
      <div id="log" class="log-body"></div>
    </section>

    <footer class="ftr">
      <span id="foot-note" class="hint">Load unpacked → click Connect</span>
      <button id="reload-ext" title="Re-read every extension file from disk (a running service worker keeps executing the code it started with)">Reload extension</button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
