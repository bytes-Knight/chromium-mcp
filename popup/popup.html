<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chrome MCP Bridge</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="wrap">
    <header class="topbar">
      <div class="logo">
        <svg viewBox="0 0 128 128" width="26" height="26" aria-hidden="true">
          <rect x="6" y="6" width="116" height="116" rx="28" fill="#0e1326" stroke="#1c2b57" stroke-width="6"/>
          <line x1="40" y1="88" x2="40" y2="98" stroke="#3ddc97" stroke-width="9" stroke-linecap="round"/>
          <line x1="88" y1="88" x2="88" y2="98" stroke="#3ddc97" stroke-width="9" stroke-linecap="round"/>
          <line x1="40" y1="93" x2="88" y2="93" stroke="#5b8cff" stroke-width="7" stroke-linecap="round"/>
          <path d="M40 88 L64 42 L88 88" fill="none" stroke="#3ddc97" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
          <circle cx="64" cy="42" r="11" fill="#3ddc97"/>
        </svg>
        <div class="title-block">
          <h1>Chrome MCP Bridge</h1>
          <span class="subtitle">clean-room extension</span>
        </div>
      </div>
    </header>

    <section class="status-cards">
      <div class="card" id="card-native">
        <span class="card-label">Native host</span>
        <span class="pill" id="pill-native">…</span>
      </div>
      <div class="card" id="card-server">
        <span class="card-label">MCP server</span>
        <span class="pill" id="pill-server">…</span>
      </div>
    </section>

    <section class="endpoint">
      <span class="card-label">Endpoint</span>
      <div class="endpoint-row">
        <code id="endpoint">http://127.0.0.1:12306/mcp</code>
        <button id="copy-btn" title="Copy endpoint">copy</button>
      </div>
      <span class="card-label hint" id="ext-id"></span>
    </section>

    <section class="port-row">
      <label for="port">MCP port</label>
      <input id="port" type="number" min="1024" max="65535" value="12306" />
      <button id="connect-btn" class="primary">Connect</button>
      <button id="disconnect-btn">Disconnect</button>
    </section>

    <section class="log">
      <div class="log-head">
        <span>Session log</span>
        <button id="clear-log">clear</button>
      </div>
      <div id="log" class="log-body"></div>
    </section>

    <footer class="foot">
      <span id="foot-note">Load unpacked → click Connect</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
